name: Feature request
description: Suggest something that would help with your stated choice experiments
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Describe the study or the step where UtilityLab falls short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: textarea
    id: references
    attributes:
      label: References
      description: Papers or tools that do this well, if any.
